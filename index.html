<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b3df5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14112b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="بیومانا: بیومکانیک دستگاه اسکلتی‌ـ‌عضلانی برای دانشجویان فیزیوتراپی؛ هر مفهوم را آن‌قدر از راه‌های مختلف توضیح می‌دهیم تا بفهمی. با تمرین، فلش‌کارت و آزمون." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="بیومانا" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      AI tutor (بیو): the app calls ./api/tutor on the same site by default.
      To use a tutor server on another address, put its full URL in content="".
      Without a reachable tutor the app still works fully with its built-in explanations.
    -->
    <meta name="biomana-ai-endpoint" content="" />
    <title>بیومانا</title>
    <script src="/theme.js"></script>
    <style>
      /* Loading screen: shown while the app downloads (slow mobile networks), replaced when React mounts. */
      html { background: #f5f3ff; }
      .boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #1d1745; font: 700 1rem/1.6 system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; }
      .boot-name { font-size: 1.6rem; font-weight: 800; }
      .boot-bar { width: 120px; height: 6px; border-radius: 99px; background: rgba(91, 61, 245, 0.16); overflow: hidden; }
      .boot-bar span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #5b3df5; animation: boot 1.1s ease-in-out infinite alternate; }
      .boot-note { font-size: 0.85rem; opacity: 0.7; }
      @keyframes boot { from { transform: translateX(0); } to { transform: translateX(-150%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar span { animation: none; width: 100%; opacity: 0.5; } }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #100d24; color-scheme: dark; }
        html:not([data-theme='light']) .boot { color: #f3f1ff; }
        html:not([data-theme='light']) .boot-bar { background: rgba(138, 113, 255, 0.22); }
        html:not([data-theme='light']) .boot-bar span { background: #8a71ff; }
      }
      html[data-theme='dark'] { background: #100d24; color-scheme: dark; }
      html[data-theme='dark'] .boot { color: #f3f1ff; }
      html[data-theme='dark'] .boot-bar { background: rgba(138, 113, 255, 0.22); }
      html[data-theme='dark'] .boot-bar span { background: #8a71ff; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <img src="./favicon.svg" width="64" height="64" alt="" />
        <div class="boot-name">بیومانا</div>
        <div class="boot-bar"><span></span></div>
        <div class="boot-note">در حال آماده شدن</div>
      </div>
    </div>
    <noscript>برای استفاده از بیومانا، جاوااسکریپت مرورگر را روشن کنید.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
